name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [www, visual, shop]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install toolchain (mise)
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm --filter "@pbpc/${APP}" deploy
        env:
          APP: ${{ matrix.app }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FOURTHWALL_STOREFRONT_TOKEN: ${{ secrets.FOURTHWALL_STOREFRONT_TOKEN }}
          FOURTHWALL_SHOP_DOMAIN: ${{ vars.FOURTHWALL_SHOP_DOMAIN }}

      - name: Site audit (squirrelscan)
        run: |
          curl -fsSL https://install.squirrelscan.com | bash
          "$HOME/.squirrel/bin/squirrel" audit "https://${HOST}.peanutbutterporkchop.com/" \
            --config .config/squirrel.toml --fail-on 'severity>=error' 2>/dev/null
        env:
          HOST: ${{ matrix.app }}
