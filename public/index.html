<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>peanutbutter-porkchop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; user-select: none; }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #grid {
      position: fixed; inset: 0; display: grid; place-items: center; touch-action: none;
      perspective: 1400px; perspective-origin: 50% 50%;
      transition: transform .35s cubic-bezier(.4, 0, .2, 1), opacity .35s;
      will-change: transform;
    }
    #cells {
      display: grid; justify-content: center;
      transform-style: preserve-3d;
      transform: rotateX(var(--tx, 0deg)) rotateY(var(--ty, 0deg));
      transition: transform .6s cubic-bezier(.2, .8, .2, 1);
    }
    #cells figure {
      position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #111; border-radius: 6px;
      outline: 2px solid transparent; outline-offset: 3px;
      transform: translateZ(var(--z, 0px)) rotateY(var(--ry, 0deg)) scale(var(--pop, 1));
      transition: outline-color .15s, transform .3s;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
    }
    #cells figure.active { --pop: 1.06; outline-color: #fff; z-index: 1; }
    #cells figure.broken { background: repeating-linear-gradient(45deg, #111 0 8px, #1a1a1a 8px 16px); }
    #cells canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    body[data-mode="full"] #grid { opacity: 0; pointer-events: none; }
    body[data-mode="grid"] #stage { visibility: hidden; }
    body.snap #grid { transition: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "wtc-gl": "https://esm.sh/wtc-gl@1.5.0"
      }
    }
  </script>
</head>
<body data-mode="full">
  <main id="stage"></main>
  <div id="grid"><div id="cells"></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
