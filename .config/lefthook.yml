# Git hooks. lefthook reads .config/lefthook.yml natively; `pnpm install`
# runs `lefthook install`. Binaries: npm tools via `pnpm exec`, the rest via mise.
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint -g .config/commitlint.config.mjs --edit {1}

pre-commit:
  parallel: true
  jobs:
    # Format, then check. Never `ultracite fix` here: some oxlint "safe" fixes
    # change runtime behavior (`'' || x` vs `'' ?? x`).
    - name: code
      group:
        piped: true
        jobs:
          - name: format
            glob: '*.{js,mjs,cjs,ts,mts,astro,json,jsonc,css,md,yml,yaml,toml}'
            run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - name: lint
            glob: '*.{js,mjs,cjs,ts,mts,astro}'
            run: pnpm exec ultracite check {staged_files}
    - name: spell
      glob: '*.{js,mjs,cjs,ts,mts,astro,md,json,jsonc,yml,yaml,toml,css,html}'
      run: pnpm exec cspell -c .config/cspell.json --no-progress --no-must-find-files {staged_files}
    - name: markdown
      glob: '*.md'
      run: markdownlint-cli2 --config .config/markdownlint-cli2.jsonc {staged_files}
    - name: yaml
      glob: '*.{yml,yaml}'
      run: yamllint -s -c .config/yamllint.yaml {staged_files}
    - name: actions
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint -config-file .config/actionlint.yaml {staged_files}
    - name: secrets
      run: betterleaks git --pre-commit --staged --no-banner --redact -c .config/betterleaks.toml

pre-push:
  jobs:
    - name: check
      run: pnpm check
