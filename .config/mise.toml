# Toolchain for this repo, local and CI (jdx/mise-action). JS tools (ultracite,
# oxlint, oxfmt, cspell, fallow, commitlint) are devDependencies run via pnpm.
#
# First time: `mise trust && mise run setup`
[tools]
node = "26.13.0"
pnpm = "12.18.0"
lefthook = "2.2.2"
betterleaks = "1.10.0"
actionlint = "1.7.12"
shellcheck = "0.11.0" # actionlint shells out to it for `run:` steps
yamllint = "1.38.0"
markdownlint-cli2 = "0.24.0"

[tasks.setup]
description = "Install dependencies and git hooks"
run = ["pnpm install"]

[tasks.check]
description = "Run every quality gate"
run = "pnpm check"

[tasks.install-squirrel]
description = "Install squirrelscan (not in the mise registry); `squirrel audit <url>`"
run = "curl -fsSL https://install.squirrelscan.com | bash"
